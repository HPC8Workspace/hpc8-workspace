<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E7C7B">
<title>HPC8 Workspace · ระบบติดตามงานศูนย์</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #F2F7F5; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #5E7378; font: 500 15px/1.6 Tahoma, 'IBM Plex Sans Thai', sans-serif; }
</style>
</head>
<body>
<div class="boot" id="boot">กำลังโหลด…</div>
<!-- 👉 เปลี่ยนลิงก์ด้านล่างให้ตรงกับ Web App ของคุณ (ลงท้ายด้วย /exec) -->
<iframe id="app" title="HPC8 Workspace"
  src="https://script.google.com/macros/s/AKfycbz5hoMwstakSo81uSxAIMFYDDm8_RuyRKsNHtrLx88SY3WC9qFM6NRkwWjdNuSzlXIA/exec"
  allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
/*
 * HPC8 Workspace — หน้าห่อ (wrapper)
 * วางไฟล์นี้บน GitHub Pages ของคุณ (เช่น hpc8workspace.github.io/hpc8-workspace/index.html)
 * ทำหน้าที่:
 *   1. ซ่อนแบนเนอร์ Google Apps Script ด้วยการฝัง iframe เต็มจอ
 *   2. เก็บ token/email ของผู้ใช้ไว้ที่โดเมนนี้ แทนที่จะพึ่งที่เก็บใน iframe
 *      เพื่อแก้ปัญหา Safari/LINE บน iPhone ล้าง storage ของ iframe ง่าย ทำให้ต้องกรอก
 *      อีเมล+PIN ใหม่ทุกครั้งที่กลับมาเปิด
 * วิธีสื่อสาร: iframe (เว็บแอป) ส่ง postMessage ที่มี field "ctwSync" มาร้องขอ/บันทึก/ลบ
 *   - request          → ตอบด้วย response + token + email
 *   - set   + key+val  → บันทึกใน localStorage ของโดเมนนี้
 *   - del   + key      → ลบ
 * รับเฉพาะ key ที่อยู่ใน whitelist (ctw_token, ctw_email) และตอบเฉพาะต้นทาง Google Apps Script
 */
(function () {
  'use strict';
  var ALLOWED_KEYS = { ctw_token: 1, ctw_email: 1 };
  function allowOrigin(origin) {
    try {
      var h = new URL(origin).hostname;
      return /\.googleusercontent\.com$/i.test(h) || /(^|\.)google\.com$/i.test(h);
    } catch (e) { return false; }
  }
  function g(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function s(k, v) { try { window.localStorage.setItem(k, String(v || '')); } catch (e) {} }
  function d(k)    { try { window.localStorage.removeItem(k); } catch (e) {} }

  window.addEventListener('message', function (e) {
    if (!allowOrigin(e.origin)) return;
    var m = e.data || {};
    if (typeof m.ctwSync !== 'string') return;
    if (m.ctwSync === 'request') {
      try { e.source.postMessage({ ctwSync: 'response', token: g('ctw_token'), email: g('ctw_email') }, e.origin); } catch (ex) {}
    } else if (m.ctwSync === 'set' && ALLOWED_KEYS[m.key]) {
      s(m.key, m.value);
    } else if (m.ctwSync === 'del' && ALLOWED_KEYS[m.key]) {
      d(m.key);
    }
  });

  // ซ่อนข้อความ "กำลังโหลด…" เมื่อ iframe โหลดเสร็จ
  var ifr = document.getElementById('app'), boot = document.getElementById('boot');
  ifr.addEventListener('load', function () { if (boot) boot.style.display = 'none'; });
})();
</script>
</body>
</html>
