<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E7C7B">
<title>HPC8 Workspace · ระบบติดตามงานศูนย์</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #F2F7F5; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #5E7378; font: 500 15px/1.6 Tahoma, 'IBM Plex Sans Thai', sans-serif; }
</style>
</head>
<body>
<div class="boot" id="boot">กำลังโหลด…</div>
<!-- 👉 ลิงก์ Web App ของคุณ -->
<iframe id="app" title="HPC8 Workspace"
  src="https://script.google.com/macros/s/AKfycbz5hoMwstakSo81uSxAIMFYDDm8_RuyRKsNHtrLx88SY3WC9qFM6NRkwWjdNuSzlXIA/exec"
  allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
/*
 * HPC8 Workspace — หน้าห่อ (wrapper) รุ่นแก้ไขปัญหา Nested Iframe ของ Google Apps Script
 * เก็บทั้งใน localStorage และ First-party Cookie อายุ 1 ปี บนโดเมน GitHub Pages
 */
(function () {
  'use strict';
  var ALLOWED_KEYS = { ctw_token: 1, ctw_email: 1 };

  function allowOrigin(origin) {
    try {
      var h = new URL(origin).hostname;
      return /\.googleusercontent\.com$/i.test(h) || /(^|\.)google\.com$/i.test(h);
    } catch (e) { return false; }
  }

  // อ่านค่าจาก localStorage ก่อน ถ้าไม่มีให้ดึงจาก Cookie สำรอง
  function getCookie(k) {
    try {
      var m = document.cookie.match(new RegExp('(?:^|; )' + k.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    } catch (e) { return ''; }
  }
  function setCookie(k, v) {
    try {
      document.cookie = k + '=' + encodeURIComponent(v) + '; max-age=31536000; path=/; SameSite=Lax';
    } catch (e) {}
  }
  function delCookie(k) {
    try {
      document.cookie = k + '=; max-age=0; path=/; SameSite=Lax';
    } catch (e) {}
  }

  function g(k) {
    var val = '';
    try { val = window.localStorage.getItem(k) || ''; } catch (e) {}
    if (!val) {
      val = getCookie(k);
      if (val) { try { window.localStorage.setItem(k, val); } catch (e) {} }
    }
    return val;
  }
  function s(k, v) {
    var str = String(v || '');
    try { window.localStorage.setItem(k, str); } catch (e) {}
    setCookie(k, str);
  }
  function d(k) {
    try { window.localStorage.removeItem(k); } catch (e) {}
    delCookie(k);
  }

  window.addEventListener('message', function (e) {
    if (!allowOrigin(e.origin)) return;
    var m = e.data || {};
    if (typeof m.ctwSync !== 'string') return;
    if (m.ctwSync === 'request') {
      try {
        e.source.postMessage({
          ctwSync: 'response',
          token: g('ctw_token'),
          email: g('ctw_email')
        }, '*');
      } catch (ex) {}
    } else if (m.ctwSync === 'set' && ALLOWED_KEYS[m.key]) {
      s(m.key, m.value);
    } else if (m.ctwSync === 'del' && ALLOWED_KEYS[m.key]) {
      d(m.key);
    }
  });

  // ซ่อนข้อความ "กำลังโหลด…" เมื่อ iframe โหลดเสร็จ
  var ifr = document.getElementById('app'), boot = document.getElementById('boot');
  ifr.addEventListener('load', function () {
    if (boot) boot.style.display = 'none';
  });
})();
</script>
</body>
</html>
